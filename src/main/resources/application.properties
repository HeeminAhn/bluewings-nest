# Application
quarkus.application.name=bluewings-nest

# HTTP
quarkus.http.host=0.0.0.0
quarkus.http.port=8180

# Response Compression (gzip)
quarkus.http.enable-compression=true
quarkus.http.compress-media-types=application/json,text/html,text/plain,text/css,application/javascript

# Database Configuration (Supabase PostgreSQL - Transaction Pooler)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres.yqqutskbkkqtotricbjo}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:6543/postgres?prepareThreshold=0}
quarkus.datasource.jdbc.max-size=16

# Hibernate ORM
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.database.default-schema=bluewings_nest

# Flyway
quarkus.flyway.migrate-at-start=false
quarkus.flyway.locations=db/migration
quarkus.flyway.schemas=bluewings_nest
quarkus.flyway.create-schemas=true

# JWT Configuration
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=bluewings-nest
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.new-token.lifespan=86400

# CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:3001,http://localhost:3100,http://frontend:3000,http://admin:3001,https://bluewingsnest.com,https://admin.bluewingsnest.com,https://api.bluewingsnest.com
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=*
quarkus.http.cors.exposed-headers=*
quarkus.http.cors.access-control-allow-credentials=true

# OpenAPI & Swagger
quarkus.smallrye-openapi.info-title=Bluewings Nest API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=블루윙즈 팬 커뮤니티 API
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# Dev Profile
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.log.level=INFO
%dev.quarkus.log.category."com.bluewings".level=DEBUG

# Test Profile
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.flyway.migrate-at-start=false

# File Upload
app.upload.path=./uploads
app.upload.max-size=10485760
quarkus.http.body.uploads-directory=${app.upload.path}

# HTTP Access Log
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%{REMOTE_HOST} - %u %t "%r" %s %b %D ms
quarkus.http.access-log.log-to-file=false

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.bluewings".level=DEBUG
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
